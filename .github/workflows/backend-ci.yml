name: Backend CI

on:
  push:
    branches: [main, feature/backend, feature/rescue-cats-errors]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java 25 build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check rescue UI and JavaScript
        run: |
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/demo.js
          node --check src/main/resources/static/rescue-ui.js
          node --test scripts/test-rescue-ui.mjs
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build
        run: ./mvnw --batch-mode --no-transfer-progress clean package
      - name: Chatbot syntax
        run: python3 -m compileall -q chatbot/fornitori_chatbot

  postgres-startup:
    name: Database scripts and application startup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fornitori
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fornitori"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fornitori
      SPRING_DATASOURCE_USERNAME: fornitori_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create least-privilege application role
        env:
          PGPASSWORD: ci-only-password
        run: |
          app_password="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$app_password"
          echo "SPRING_DATASOURCE_PASSWORD=$app_password" >> "$GITHUB_ENV"
          psql --host localhost --username postgres --dbname fornitori --set ON_ERROR_STOP=1 \
            --command "CREATE ROLE fornitori_app LOGIN PASSWORD '$app_password'"
      - name: Apply database scripts in order
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql --host localhost --username postgres --dbname fornitori --set ON_ERROR_STOP=1 \
            --command "CREATE DATABASE fornitori_e2e_ci"
          for database in fornitori fornitori_e2e_ci; do
            for script in database/*.sql; do
              psql --host localhost --username postgres --dbname "$database" --set ON_ERROR_STOP=1 --file "$script"
            done
            psql --host localhost --username postgres --dbname "$database" --set ON_ERROR_STOP=1 \
              --command "GRANT CONNECT ON DATABASE $database TO fornitori_app; GRANT USAGE ON SCHEMA public TO fornitori_app; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO fornitori_app; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO fornitori_app;"
          done
      - name: Run tests on the temporary database
        env:
          FORNITORI_TEST_DATABASE: isolated
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fornitori_e2e_ci
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Build and start the application
        run: |
          ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests
          SERVER_ADDRESS=127.0.0.1 SERVER_PORT=58880 java -jar target/fornitori-0.0.1-SNAPSHOT.jar > target/app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:58880/api/v1/auth/csrf > /dev/null; then
              echo "Application started"
              exit 0
            fi
            sleep 1
          done
          cat target/app.log
          exit 1
