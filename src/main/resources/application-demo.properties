# Only for the isolated, public demonstration database.
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.name=JSESSIONID
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.cleanup-cron=-
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=240000
# Explicit proposals make the client walkthrough predictable; no idle background worker is assumed.
fornitori.missions.auto-assign=false
